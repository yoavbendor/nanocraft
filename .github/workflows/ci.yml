name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.cxx }} ${{ matrix.config }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cxx: g++-13,     config: Release,   sanitizer: "",                  werror: "ON" }
          - { cxx: clang++-18, config: Release,   sanitizer: "",                  werror: "ON" }
          # GCC's -Warray-bounds is noisy under sanitizer instrumentation: no -Werror there.
          - { cxx: g++-13,     config: asan-ubsan, sanitizer: "address,undefined", werror: "OFF" }
          - { cxx: clang++-18, config: asan-ubsan, sanitizer: "address,undefined", werror: "OFF" }
          - { cxx: g++-13,     config: profile,   sanitizer: "",                  werror: "ON", profile: "ON" }
    steps:
      - uses: actions/checkout@v4

      - name: Python oracle modules (dpkt, scapy)
        run: python3 -m pip install --user dpkt scapy

      - name: OTS packet analyzers (tshark, tcpdump)
        run: |
          sudo apt-get update -qq
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y -qq --no-install-recommends tshark tcpdump
          tshark --version | head -n 1
          tcpdump --version | head -n 1

      - name: Configure (nanowire + nanom via FetchContent, pinned)
        run: >
          cmake -S . -B build
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DCMAKE_BUILD_TYPE=${{ matrix.sanitizer && 'RelWithDebInfo' || 'Release' }}
          -DNANOCRAFT_SANITIZER=${{ matrix.sanitizer }}
          -DNANOCRAFT_WERROR=${{ matrix.werror }}
          -DNANOCRAFT_PROFILE=${{ matrix.profile || 'OFF' }}

      - name: One nanom only (nanowire shares nanocraft's)
        run: |
          test -d build/_deps/nanowire-src
          test "$(ls -d build/_deps/nanom*-src | wc -l)" = 1

      - name: Build
        run: cmake --build build -j4

      - name: Test
        env:
          NANOCRAFT_REQUIRE_OTS: "1"
        run: ctest --test-dir build --output-on-failure

      - name: OTS piped verifiers (tshark + tcpdump)
        env:
          NANOCRAFT_REQUIRE_OTS: "1"
        run: ctest --test-dir build -R ots_oracle -V

      - name: Live TX tests on lo (AF_PACKET needs CAP_NET_RAW)
        run: sudo ./build/tests/test_linux_tx

      - name: Bench smoke
        if: matrix.sanitizer == ''
        run: ./build/bench/craft_bench all 200000
